<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pranav Badgi — Portfolio</title>
  <meta name="description" content="Portfolio of Pranav Badgi — projects, work, and contact." />
  <meta property="og:title" content="Pranav Badgi — Portfolio" />
  <meta property="og:description" content="Portfolio of Pranav Badgi — projects, work, and contact." />
  <meta property="og:type" content="website" />
  <!-- Kept in sync with settings.meta.ogImage by the macOS admin app, which
       commits a direct edit to this tag on upload (social-media crawlers
       don't run JS, so a Firebase-only save wouldn't show up in previews —
       this static site has no build step to template it in otherwise). -->
  <meta property="og:image" content="https://www.itspranavbadgi.com/apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Loaded as direct parallel <link> tags (not css/styles.css's @import
       chain) so the browser's preload scanner can discover and fetch all
       six immediately from the HTML, instead of first fetching+parsing one
       file before it even learns the other five exist. Order matters for
       the cascade (reset -> variables -> base -> layout -> components ->
       animations) and is preserved regardless of fetch completion order. -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <script>
    document.documentElement.classList.remove('no-js');
    // Applied synchronously, before first paint, so the page never flashes
    // the wrong theme for a returning visitor — by the time css/styles.css
    // finishes loading, data-theme is already set and the dark overrides
    // in variables.css are already in effect if applicable.
    (function () {
      var stored = localStorage.getItem('badgip.theme');
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0a0c' : '#ffffff');
    })();
  </script>
</head>
<body>
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__count mono"><span class="digit" id="preloaderDigit">00</span>%</div>
  </div>

  <nav class="site-nav" id="siteNav" data-open="false">
    <button type="button" class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="Switch between light and dark theme">
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" />
        <path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" />
      </svg>
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
      </svg>
      <span class="theme-toggle__thumb mono" aria-hidden="true">PB</span>
    </button>
    <button class="site-nav__toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="bar-1"></span>
      <span class="bar-2"></span>
      <span class="bar-3"></span>
    </button>
    <ul class="site-nav__list" id="navList">
      <li><a href="#home" class="site-nav__link mono" data-nav-link="home"><span class="num">00</span><span class="label">Home</span></a></li>
      <li id="navContactItem" data-mode="professional"><a href="#contact" class="site-nav__link mono" data-nav-link="contact"><span class="num">—</span><span class="label">Contact</span></a></li>
    </ul>
  </nav>

  <main id="mainContent">
    <section class="hero" id="home">
      <img class="hero__avatar reveal" id="heroAvatar" alt="" hidden />
      <span class="eyebrow hero__greeting reveal" id="heroGreeting">Hello, I'm</span>
      <h1 class="hero__name reveal" id="heroName">Pranav Badgi</h1>
      <span class="hero__role mono reveal" id="heroRole">Full Stack Developer</span>
      <p class="hero__description reveal" id="heroDescription">
        Building modern, thoughtful software — from idea to shipped product.
      </p>
      <div class="hero__cta reveal">
        <a href="#projects" class="btn btn--primary btn--lg" id="heroCtaPrimary">
          <span id="heroCtaPrimaryText">View My Work</span>
          <span class="btn__arrow" aria-hidden="true">→</span>
        </a>
        <a href="#contact" class="btn btn--ghost btn--lg" id="heroCtaSecondary">Get In Touch</a>
      </div>
    </section>

    <div id="dynamicSections"></div>

    <section class="section" id="contact" data-mode="professional">
      <div class="section-header">
        <span class="section-number mono" id="contactSectionNumber">—</span>
        <h2 class="section-title">Contact</h2>
      </div>

      <div class="contact-panels">
        <div class="contact-info-panel reveal" id="contactInfoPanel">
          <div class="contact-info-panel__bg" id="contactInfoPanelBg" aria-hidden="true"></div>
          <div class="contact-info-panel__content">
            <h3 class="contact-info-panel__title" id="contactInfoTitle">Contact information</h3>
            <p class="contact-info-panel__subtitle" id="contactInfoSubtitle"></p>
            <div class="contact-info-list" id="contactInfoList"></div>
          </div>
        </div>

        <div class="contact-form-panel reveal">
          <h3 class="contact-form-panel__title" id="contactFormTitle">Get in touch</h3>
          <p class="contact-form-panel__subtitle" id="contactFormSubtitle"></p>

          <form class="contact-form-grid" id="contactForm" novalidate>
            <div class="form-field">
              <label for="cfName">Name <span class="required-mark">*</span></label>
              <div class="form-field__input-icon">
                <span class="form-field__icon" aria-hidden="true">👤</span>
                <input type="text" id="cfName" name="name" autocomplete="name" required />
              </div>
            </div>
            <div class="form-field form-field--message">
              <label for="cfMessage">Message <span class="required-mark">*</span></label>
              <textarea id="cfMessage" name="message" required></textarea>
            </div>
            <div class="form-field">
              <label for="cfEmail">Email ID <span class="required-mark">*</span></label>
              <div class="form-field__input-icon">
                <span class="form-field__icon" aria-hidden="true">✉️</span>
                <input type="email" id="cfEmail" name="email" autocomplete="email" required />
              </div>
            </div>
            <div class="form-field">
              <label for="cfPhone">Phone</label>
              <div class="form-field__input-icon">
                <span class="form-field__icon" aria-hidden="true">📱</span>
                <input type="tel" id="cfPhone" name="phone" autocomplete="tel" placeholder="Optional" />
              </div>
            </div>
            <div class="form-field form-field--honeypot" aria-hidden="true">
              <label for="cfCompany">Company</label>
              <input type="text" id="cfCompany" name="company" tabindex="-1" autocomplete="off" />
            </div>
            <button type="submit" class="btn btn--primary" id="contactSubmit">Send Message</button>
            <p class="contact-form__status mono" id="contactStatus" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span class="mono">© <span id="footerYear"></span> Pranav Badgi. All rights reserved.</span>
    <div class="site-footer__socials" id="footerSocials"></div>
  </footer>

  <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="Content mode">
    <span class="mode-switch__pill" aria-hidden="true"></span>
    <button class="mode-switch__btn is-active mono" id="modeProfessional" role="tab" aria-selected="true" data-mode-btn="professional">Professional</button>
    <button class="mode-switch__btn mono" id="modePersonal" role="tab" aria-selected="false" data-mode-btn="personal">Personal</button>
  </div>

  <template id="sectionTemplate-about">
    <section class="section" id="about">
      <div class="section-header">
        <span class="section-number mono"></span>
        <h2 class="section-title">About</h2>
      </div>
      <p class="about__bio reveal" id="aboutBioProfessional"></p>
      <div class="timeline" id="timelineProfessional">
        <div class="timeline__progress" id="timelineProgress"></div>
      </div>
    </section>
  </template>

  <template id="sectionTemplate-projects">
    <section class="section" id="projects">
      <div class="section-header">
        <span class="section-number mono"></span>
        <h2 class="section-title">Projects</h2>
      </div>
      <div class="projects__grid" id="projectsGrid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </section>
  </template>

  <template id="sectionTemplate-youtube">
    <section class="section" id="youtube">
      <div class="section-header">
        <span class="section-number mono"></span>
        <h2 class="section-title">YouTube</h2>
      </div>
      <div class="youtube-carousel" id="youtubeCarousel">
        <div class="skeleton youtube-card"></div>
        <div class="skeleton youtube-card"></div>
        <div class="skeleton youtube-card"></div>
      </div>
    </section>
  </template>

  <template id="sectionTemplate-blog">
    <section class="section" id="blog">
      <div class="section-header">
        <span class="section-number mono"></span>
        <h2 class="section-title">Blog</h2>
      </div>
      <div class="blog-list" id="blogGrid">
        <div class="skeleton blog-list-item-skeleton"></div>
        <div class="skeleton blog-list-item-skeleton"></div>
        <div class="skeleton blog-list-item-skeleton"></div>
      </div>
    </section>
  </template>

  <template id="sectionTemplate-custom">
    <section class="section custom-section">
      <div class="section-header">
        <span class="section-number mono"></span>
        <h2 class="section-title"></h2>
      </div>
      <div class="custom-section__grid"></div>
    </section>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
